<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="board">
        <div>
          <h1>Player's board</h1>
          <div class="player-board"></div>
        </div>
        <div>
          <h1>Computer's board</h1>
          <div class="computer-board disable-button-click"></div>
        </div>
      </div>
      <button class="place-ships">Place Random Ships</button>
      <button class="start-game">Start Game</button>
      <button class="restart-game">Restart Game</button>
      <dialog class="alert-dialog">
        <div class="alert-container">
          <p class="alert-message"></p>
          <button class="alert-close">Close</button>
        </div>
      </dialog>
      <dialog class="winner-dialog">
        <div class="winner-container">
          <p class="winner-message"></p>
          <button class="new-game">Start New Game</button>
          <button class="hide-button">No</button>
        </div>
      </dialog>
    </div>
  </body>
</html>
